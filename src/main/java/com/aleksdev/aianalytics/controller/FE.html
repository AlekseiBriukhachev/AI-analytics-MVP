<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 AI Analytics Platform</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.2em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-weight: 500;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-success {
            background: #28a745;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dataset-item, .model-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .dataset-item h4, .model-item h4 {
            margin-bottom: 8px;
            color: #333;
        }

        .dataset-meta, .model-meta {
            color: #666;
            font-size: 0.9em;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
        }

        .tab {
            flex: 1;
            padding: 10px 15px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .tab.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .metric {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .metric-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 2em;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // API клиент
    const api = axios.create({
        baseURL: '/api',
        timeout: 30000
    });

    // Главный компонент приложения
    function App() {
        const [dashboard, setDashboard] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);

        const loadDashboard = useCallback(async () => {
            try {
                setLoading(true);
                const response = await api.get('/analytics/dashboard');
                setDashboard(response.data);
                setError(null);
            } catch (err) {
                setError(err.response?.data?.message || err.message);
            } finally {
                setLoading(false);
            }
        }, []);

        useEffect(() => {
            loadDashboard();
            const interval = setInterval(loadDashboard, 30000); // Обновляем каждые 30 секунд
            return () => clearInterval(interval);
        }, [loadDashboard]);

        if (loading && !dashboard) {
            return (
                <div className="app-container">
                    <div className="loading">
                        <div className="spinner"></div>
                        <span>Загрузка платформы...</span>
                    </div>
                </div>
            );
        }

        return (
            <div className="app-container fade-in">
                <Header />
                {error && (
                    <div className="alert alert-error">
                        Ошибка загрузки: {error}
                    </div>
                )}
                {dashboard && <StatsGrid stats={dashboard} />}
                <MainContent onRefresh={loadDashboard} />
            </div>
        );
    }

    // Компонент заголовка
    function Header() {
        return (
            <div className="header">
                <h1>🧠 AI Analytics Platform</h1>
                <p>Профессиональная платформа для анализа данных с помощью нейронных сетей</p>
            </div>
        );
    }

    // Компонент статистики
    function StatsGrid({ stats }) {
        const statItems = [
            { label: 'Датасетов', value: stats?.totalDatasets || 0, icon: '📊' },
            { label: 'Моделей', value: stats?.totalModels || 0, icon: '🤖' },
            { label: 'За сутки', value: (stats?.datasetsLast24h || 0) + (stats?.modelsLast24h || 0), icon: '📈' },
            { label: 'За неделю', value: (stats?.datasetsLast7d || 0) + (stats?.modelsLast7d || 0), icon: '📅' }
        ];

        return (
            <div className="stats-grid">
                {statItems.map((stat, index) => (
                    <div key={index} className="stat-card">
                        <div className="stat-value">{stat.icon} {stat.value}</div>
                        <div className="stat-label">{stat.label}</div>
                    </div>
                ))}
            </div>
        );
    }

    // Главный контент
    function MainContent({ onRefresh }) {
        return (
            <div className="main-content">
                <DatasetManager onRefresh={onRefresh} />
                <ModelManager onRefresh={onRefresh} />
            </div>
        );
    }

    // Менеджер датасетов
    function DatasetManager({ onRefresh }) {
        const [activeTab, setActiveTab] = useState('upload');
        const [datasets, setDatasets] = useState([]);
        const [loading, setLoading] = useState(false);

        const loadDatasets = useCallback(async () => {
            try {
                const response = await api.get('/datasets');
                setDatasets(response.data.data?.content || []);
            } catch (err) {
                console.error('Failed to load datasets:', err);
            }
        }, []);

        useEffect(() => {
            loadDatasets();
        }, [loadDatasets]);

        return (
            <div className="section">
                <h2 className="section-title">📁 Управление данными</h2>

                <div className="tabs">
                    <div
                        className={`tab ${activeTab === 'upload' ? 'active' : ''}`}
                        onClick={() => setActiveTab('upload')}
                    >
                        Загрузить
                    </div>
                    <div
                        className={`tab ${activeTab === 'list' ? 'active' : ''}`}
                        onClick={() => setActiveTab('list')}
                    >
                        Просмотр
                    </div>
                </div>

                {activeTab === 'upload' ? (
                    <DatasetUpload onSuccess={() => { loadDatasets(); onRefresh(); }} />
                ) : (
                    <DatasetList datasets={datasets} onRefresh={loadDatasets} />
                )}
            </div>
        );
    }

    // Компонент загрузки датасета
    function DatasetUpload({ onSuccess }) {
        const [formData, setFormData] = useState({
            name: '',
            description: '',
            data: '',
            featureNames: ''
        });
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState(null);

        const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setResult(null);

            try {
                // Парсим данные
                let data;
                if (formData.data.trim().startsWith('[')) {
                    data = JSON.parse(formData.data);
                } else {
                    data = parseCSV(formData.data);
                }

                const payload = {
                    name: formData.name,
                    description: formData.description || null,
                    data: data,
                    featureNames: formData.featureNames ? formData.featureNames.split(',').map(s => s.trim()) : []
                };

                const response = await api.post('/datasets', payload);
                setResult({ type: 'success', message: `Датасет создан! ID: ${response.data.data.id}` });
                setFormData({ name: '', description: '', data: '', featureNames: '' });
                onSuccess();
            } catch (err) {
                setResult({
                    type: 'error',
                    message: err.response?.data?.error || err.message
                });
            } finally {
                setLoading(false);
            }
        };

        const parseCSV = (text) => {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => parseFloat(v.trim()));
                const features = values.slice(0, -1);
                const label = values[values.length - 1];
                data.push({ features, label });
            }
            return data;
        };

        return (
            <form onSubmit={handleSubmit}>
                <div className="form-group">
                    <label>Название датасета *</label>
                    <input
                        type="text"
                        className="form-control"
                        value={formData.name}
                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                        required
                        placeholder="Например: Анализ продаж"
                    />
                </div>

                <div className="form-group">
                    <label>Описание</label>
                    <textarea
                        className="form-control"
                        value={formData.description}
                        onChange={(e) => setFormData({...formData, description: e.target.value})}
                        rows="3"
                        placeholder="Краткое описание данных"
                    />
                </div>

                <div className="form-group">
                    <label>Данные (CSV или JSON) *</label>
                    <textarea
                        className="form-control"
                        value={formData.data}
                        onChange={(e) => setFormData({...formData, data: e.target.value})}
                        rows="8"
                        required
                        placeholder={`CSV пример:\nfeature1,feature2,label\n1.0,2.0,1\n0.5,1.5,0\n\nJSON пример:\n[{"features":[1.0,2.0],"label":1}]`}
                    />
                </div>

                <div className="form-group">
                    <label>Названия признаков (через запятую)</label>
                    <input
                        type="text"
                        className="form-control"
                        value={formData.featureNames}
                        onChange={(e) => setFormData({...formData, featureNames: e.target.value})}
                        placeholder="price,quantity,category"
                    />
                </div>

                <button type="submit" className="btn" disabled={loading}>
                    {loading ? (
                        <div className="loading">
                            <div className="spinner"></div>
                            <span>Загружаем...</span>
                        </div>
                    ) : '📤 Загрузить датасет'}
                </button>

                {result && (
                    <div className={`alert alert-${result.type}`}>
                        {result.message}
                    </div>
                )}
            </form>
        );
    }

    // Список датасетов
    function DatasetList({ datasets, onRefresh }) {
        return (
            <div>
                {datasets.length === 0 ? (
                    <p>Нет загруженных датасетов</p>
                ) : (
                    datasets.map(dataset => (
                        <div key={dataset.id} className="dataset-item">
                            <h4>{dataset.name}</h4>
                            <div className="dataset-meta">
                                <span>📊 {dataset.recordCount} записей</span>
                                <span>🔢 {dataset.featureCount} признаков</span>
                                <span>📅 {new Date(dataset.createdAt).toLocaleDateString()}</span>
                            </div>
                            {dataset.description && <p style={{marginTop: '8px', color: '#666'}}>{dataset.description}</p>}
                        </div>
                    ))
                )}
            </div>
        );
    }

    // Менеджер моделей
    function ModelManager({ onRefresh }) {
        const [activeTab, setActiveTab] = useState('train');
        const [models, setModels] = useState([]);

        const loadModels = useCallback(async () => {
            try {
                const response = await api.get('/models');
                setModels(response.data.data || []);
            } catch (err) {
                console.error('Failed to load models:', err);
            }
        }, []);

        useEffect(() => {
            loadModels();
        }, [loadModels]);

        return (
            <div className="section">
                <h2 className="section-title">🤖 Машинное обучение</h2>

                <div className="tabs">
                    <div
                        className={`tab ${activeTab === 'train' ? 'active' : ''}`}
                        onClick={() => setActiveTab('train')}
                    >
                        Обучить
                    </div>
                    <div
                        className={`tab ${activeTab === 'predict' ? 'active' : ''}`}
                        onClick={() => setActiveTab('predict')}
                    >
                        Предсказать
                    </div>
                    <div
                        className={`tab ${activeTab === 'models' ? 'active' : ''}`}
                        onClick={() => setActiveTab('models')}
                    >
                        Модели
                    </div>
                </div>

                {activeTab === 'train' && (
                    <ModelTraining onSuccess={() => { loadModels(); onRefresh(); }} />
                )}
                {activeTab === 'predict' && (
                    <ModelPrediction models={models} />
                )}
                {activeTab === 'models' && (
                    <ModelList models={models} onRefresh={loadModels} />
                )}
            </div>
        );
    }

    // Компонент обучения модели
    function ModelTraining({ onSuccess }) {
        const [datasets, setDatasets] = useState([]);
        const [formData, setFormData] = useState({
            datasetId: '',
            hiddenLayers: '10,5',
            learningRate: '0.01',
            epochs: '1000',
            testSplit: '0.2'
        });
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState(null);

        useEffect(() => {
            const loadDatasets = async () => {
                try {
                    const response = await api.get('/datasets');
                    setDatasets(response.data.data?.content || []);
                } catch (err) {
                    console.error('Failed to load datasets:', err);
                }
            };
            loadDatasets();
        }, []);

        const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setResult(null);

            try {
                const payload = {
                    datasetId: formData.datasetId,
                    config: {
                        hiddenLayers: formData.hiddenLayers.split(',').map(x => parseInt(x.trim())),
                        learningRate: parseFloat(formData.learningRate),
                        epochs: parseInt(formData.epochs)
                    },
                    testSplit: parseFloat(formData.testSplit)
                };

                const response = await api.post('/models/train', payload);
                const data = response.data.data;

                setResult({
                    type: 'success',
                    message: `Модель обучена успешно!`,
                    data: data
                });
                onSuccess();
            } catch (err) {
                setResult({
                    type: 'error',
                    message: err.response?.data?.error || err.message
                });
            } finally {
                setLoading(false);
            }
        };

        return (
            <form onSubmit={handleSubmit}>
                <div className="form-group">
                    <label>Датасет *</label>
                    <select
                        className="form-control"
                        value={formData.datasetId}
                        onChange={(e) => setFormData({...formData, datasetId: e.target.value})}
                        required
                    >
                        <option value="">Выберите датасет</option>
                        {datasets.map(dataset => (
                            <option key={dataset.id} value={dataset.id}>
                                {dataset.name} ({dataset.recordCount} записей)
                            </option>
                        ))}
                    </select>
                </div>

                <div className="form-group">
                    <label>Скрытые слои (через запятую)</label>
                    <input
                        type="text"
                        className="form-control"
                        value={formData.hiddenLayers}
                        onChange={(e) => setFormData({...formData, hiddenLayers: e.target.value})}
                        placeholder="10,5"
                    />
                </div>

                <div className="form-group">
                    <label>Скорость обучения</label>
                    <input
                        type="number"
                        className="form-control"
                        value={formData.learningRate}
                        onChange={(e) => setFormData({...formData, learningRate: e.target.value})}
                        step="0.001"
                        min="0.0001"
                        max="1"
                    />
                </div>

                <div className="form-group">
                    <label>Количество эпох</label>
                    <input
                        type="number"
                        className="form-control"
                        value={formData.epochs}
                        onChange={(e) => setFormData({...formData, epochs: e.target.value})}
                        min="10"
                        max="50000"
                    />
                </div>

                <button type="submit" className="btn" disabled={loading}>
                    {loading ? (
                        <div className="loading">
                            <div className="spinner"></div>
                            <span>Обучаем модель...</span>
                        </div>
                    ) : '🚀 Начать обучение'}
                </button>

                {result && (
                    <div className={`alert alert-${result.type}`}>
                        {result.message}
                        {result.data && (
                            <div className="metrics-grid">
                                <div className="metric">
                                    <div className="metric-value">{(result.data.accuracy * 100).toFixed(1)}%</div>
                                    <div className="metric-label">Точность</div>
                                </div>
                                <div className="metric">
                                    <div className="metric-value">{result.data.loss.toFixed(4)}</div>
                                    <div className="metric-label">Потери</div>
                                </div>
                                <div className="metric">
                                    <div className="metric-value">{result.data.trainingTime}мс</div>
                                    <div className="metric-label">Время</div>
                                </div>
                            </div>
                        )}
                    </div>
                )}
            </form>
        );
    }

    // Компонент предсказаний
    function ModelPrediction({ models }) {
        const [formData, setFormData] = useState({
            modelId: '',
            features: ''
        });
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState(null);

        const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setResult(null);

            try {
                const payload = {
                    modelId: formData.modelId,
                    features: formData.features.split(',').map(x => parseFloat(x.trim()))
                };

                const response = await api.post('/models/predict', payload);
                const data = response.data.data;

                setResult({
                    type: 'success',
                    message: 'Предсказание выполнено успешно!',
                    data: data
                });
            } catch (err) {
                setResult({
                    type: 'error',
                    message: err.response?.data?.error || err.message
                });
            } finally {
                setLoading(false);
            }
        };

        return (
            <form onSubmit={handleSubmit}>
                <div className="form-group">
                    <label>Модель *</label>
                    <select
                        className="form-control"
                        value={formData.modelId}
                        onChange={(e) => setFormData({...formData, modelId: e.target.value})}
                        required
                    >
                        <option value="">Выберите модель</option>
                        {models.filter(m => m.status === 'TRAINED').map(model => (
                            <option key={model.id} value={model.id}>
                                Модель {model.id.substring(0, 8)}... (точность: {(model.accuracy * 100).toFixed(1)}%)
                            </option>
                        ))}
                    </select>
                </div>

                <div className="form-group">
                    <label>Входные данные (через запятую) *</label>
                    <input
                        type="text"
                        className="form-control"
                        value={formData.features}
                        onChange={(e) => setFormData({...formData, features: e.target.value})}
                        required
                        placeholder="1.0,2.0,3.0"
                    />
                </div>

                <button type="submit" className="btn" disabled={loading || !formData.modelId}>
                    {loading ? (
                        <div className="loading">
                            <div className="spinner"></div>
                            <span>Предсказываем...</span>
                        </div>
                    ) : '🎯 Выполнить предсказание'}
                </button>

                {result && (
                    <div className={`alert alert-${result.type}`}>
                        {result.message}
                        {result.data && (
                            <div className="metrics-grid">
                                <div className="metric">
                                    <div className="metric-value">{result.data.prediction.toFixed(4)}</div>
                                    <div className="metric-label">Предсказание</div>
                                </div>
                                <div className="metric">
                                    <div className="metric-value">{(result.data.confidence * 100).toFixed(1)}%</div>
                                    <div className="metric-label">Уверенность</div>
                                </div>
                                <div className="metric">
                                    <div className="metric-value">{result.data.predictedClass}</div>
                                    <div className="metric-label">Класс</div>
                                </div>
                            </div>
                        )}
                    </div>
                )}
            </form>
        );
    }

    // Список моделей
    function ModelList({ models, onRefresh }) {
        const getStatusColor = (status) => {
            switch (status) {
                case 'TRAINED': return '#28a745';
                case 'TRAINING': return '#ffc107';
                case 'ERROR': return '#dc3545';
                default: return '#6c757d';
            }
        };

        const getStatusIcon = (status) => {
            switch (status) {
                case 'TRAINED': return '✅';
                case 'TRAINING': return '⏳';
                case 'ERROR': return '❌';
                default: return '⚪';
            }
        };

        return (
            <div>
                {models.length === 0 ? (
                    <p>Нет обученных моделей</p>
                ) : (
                    models.map(model => (
                        <div key={model.id} className="model-item">
                            <h4>
                                {getStatusIcon(model.status)} Модель {model.id.substring(0, 8)}...
                            </h4>
                            <div className="model-meta">
                                <span style={{color: getStatusColor(model.status)}}>
                                    📊 {model.status}
                                </span>
                                {model.accuracy > 0 && (
                                    <span>🎯 {(model.accuracy * 100).toFixed(1)}% точность</span>
                                )}
                                <span>⚡ {model.epochs} эпох</span>
                                <span>⏱️ {model.trainingTime}мс</span>
                                <span>📅 {new Date(model.createdAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                    ))
                )}
            </div>
        );
    }

    // Рендер приложения
    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
