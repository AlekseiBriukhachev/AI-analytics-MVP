spring:
  application:
    name: ai-analytics

  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  cache:
    type: simple

  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100

# Endpoints management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when_authorized

# Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /index.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha

# Logging configuration
logging:
  level:
    com.aleksdev.aianalytics: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.autoconfigure.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

#Custome configuration
aianalytics:
  ml:
    max-training-time: 300000 # 5 minutes in milliseconds
    max-features: 1000
    max-dataset-size: 10000
  api:
    rate-limit: 1000 # requests per hour
